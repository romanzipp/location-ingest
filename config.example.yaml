server:
  listen: ":8080"

web:
  enabled: true
  max_requests_per_client: 500

clients:
  # A client is a single device that sends location info
  - name: roman
    # Define the endpoints + kinds for the locaiton ingest
    #
    # kind "owntracks"
    #  -> point your Owntracks App to `<ingest-url>/ot/roman`
    #
    # kind "traccar"
    #  -> pooint your Traccar Client App to `<ingest-url>/tr/roman`
    sources:
      - kind: owntracks
        path: /ot/roman
        primary: owntracks-recorder

      - kind: traccar
        path: /tr/roman
        primary: traccar-server

    destinations:
      # Each incoming source will send the location to all of those destinations:

      owntracks-recorder:
        username: roman
        device: phone
        basic_auth:
          user: roman
          password: ${OWNTRACKS_PASSWORD}

      traccar-server:
        device_id: "12345678"

      dawarich:
        api_key: ${DAWARICH_API_KEY}

      kuma:

destinations:
  # Define all available destinations
  #
  # kind "owntracks_recorder"
  #  -> Owntracks Recorder Server
  #
  # kind "traccar_osmand"
  #  -> Traccar Server
  #
  # kind "heartbeat"
  #  -> uptime monitoring like UptimeKuma, Kuvasz

  - name: owntracks-recorder
    kind: owntracks_recorder
    url: https://recorder.example.com/pub

  - name: traccar-server
    kind: traccar_osmand
    url: https://traccar.example.com

  - name: dawarich
    kind: dawarich
    url: https://dawarich.example.com/api/v1/owntracks/points

  - name: kuma
    kind: heartbeat
    method: GET
    url: https://uptime.example.com/api/push/XXXX
    min_interval: 60s
