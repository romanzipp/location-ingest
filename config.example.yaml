server:
  listen: ":8080"

web:
  enabled: true
  max_requests_per_client: 500

clients:
  - name: roman
    sources:
      - kind: owntracks
        path: /ot/roman
        primary: owntracks-recorder

      - kind: traccar
        path: /tr/roman
        primary: traccar-server

    destinations:
      owntracks-recorder:
        username: roman
        device: phone
        basic_auth:
          user: roman
          password: ${OWNTRACKS_PASSWORD}

      traccar-server:
        device_id: roman-phone

      kuma:

destinations:
  - name: owntracks-recorder
    kind: owntracks_recorder
    url: https://recorder.example.com/pub

  - name: traccar-server
    kind: traccar_osmand
    url: https://traccar.example.com

  - name: kuma
    kind: heartbeat
    method: GET
    url: https://uptime.example.com/api/push/XXXX
    min_interval: 60s
