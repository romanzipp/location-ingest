name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set version
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/romanzipp/location-ingest:${{ steps.meta.outputs.version }}
            ghcr.io/romanzipp/location-ingest:latest

  chart:
    runs-on: ubuntu-latest
    needs: image
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5

      - name: login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: package and push chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          helm package deploy/helm/location-ingest --version "$VERSION" --app-version "$VERSION" --destination dist/
          helm push "dist/location-ingest-chart-${VERSION}.tgz" oci://ghcr.io/romanzipp
