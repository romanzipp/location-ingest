{{define "body"}}
<h2>clients</h2>

{{if not .Clients}}
    <p class="muted">no traffic yet.</p>
{{else}}
    <table>
        <thead>
        <tr>
            <th>client</th>
            <th>requests</th>
            <th>last seen</th>
        </tr>
        </thead>
        <tbody>
        {{range .Clients}}
            <tr>
                <td><a href="/webui/clients/{{.Name}}">{{.Name}}</a></td>
                <td class="num">{{.Count}}</td>
                <td class="muted">{{formatTime .LastSeen}}</td>
            </tr>
        {{end}}
        </tbody>
    </table>
{{end}}
{{end}}
