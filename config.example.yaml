server:
  listen: ":8080"

web:
  enabled: true
  max_requests_per_client: 500

clients:
  - name: phone-roman
    sources:
      - kind: owntracks
        path: /ot/phone-roman
        primary: owntracks-recorder

      - kind: traccar
        path: /tr/phone-roman
        primary: traccar-server

    destinations:
      - owntracks-recorder
      - traccar-server
      - kuma

destinations:
  - name: owntracks-recorder
    kind: owntracks_recorder
    url: https://recorder.example.com/pub
    username: roman
    device: phone
    basic_auth:
      user: roman
      password: ${OWNTRACKS_PASSWORD}

  - name: traccar-server
    kind: traccar_osmand
    url: https://traccar.example.com
    device_id: phone-roman

  - name: kuma
    kind: heartbeat
    method: GET
    url: https://uptime.example.com/api/push/XXXX
    min_interval: 60s
