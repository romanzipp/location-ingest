when:
  - event: [push, manual]

variables:
  - &step_resources
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 3Gi

steps:
  - name: vet
    image: golang:1.27-alpine
    <<: *step_resources
    environment:
      CGO_ENABLED: "0"
    commands:
      - apk add --no-cache git
      - go vet ./...

  - name: test
    image: golang:1.27-alpine
    <<: *step_resources
    environment:
      CGO_ENABLED: "0"
    commands:
      - apk add --no-cache git
      - go test -count=1 ./...
